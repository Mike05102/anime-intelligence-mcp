name: Publish ANIME INTELLIGENCE to MCP Registry

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher.tar.gz
          tar -xzf mcp-publisher.tar.gz
          chmod +x mcp-publisher

      - name: Login to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        shell: bash
        run: |
          set +e

          OUTPUT=$(./mcp-publisher publish 2>&1)
          STATUS=$?

          echo "$OUTPUT"

          echo "## MCP Registry Publish Output" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r LINE; do
            if [ -n "$LINE" ]; then
              SAFE_LINE="${LINE//'%'/'%25'}"
              SAFE_LINE="${SAFE_LINE//$'\r'/'%0D'}"
              SAFE_LINE="${SAFE_LINE//$'\n'/'%0A'}"
              echo "::error title=MCP Registry::$SAFE_LINE"
            fi
          done <<< "$OUTPUT"

          exit "$STATUS"
