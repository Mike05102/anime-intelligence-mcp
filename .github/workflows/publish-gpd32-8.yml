name: Publish GPD v32.8 bounded growth
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-gpd32-8.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify Worker
        run: |
          python3 scripts/build_gpd32_8.py
          node --check releases/GPD32_8_COMPLETE_WORKER.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('releases/GPD32_8_COMPLETE_WORKER.js').read_text()
          assert 'const VERSION="32.8.0"' in s
          assert 'Math.max(1,Math.min(2,Number(limit)||1))' in s
          assert 'checkpointedUniversalDemandRefresh(env,2,`parallel_${task}`)' in s
          assert 'if(enrichmentDiagnostics.attempted>=10)break;' in s
          assert 'batchCandidates.slice(i,i+8)' in s
          assert 'batch_insert_fallback' in s
          assert 'if(matches.length>1)' in s
          assert 'if(janMatches.length>1)' in s
          print('PASS bounded two-query growth and identity safety checks')
          PY
      - name: Publish complete Worker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/GPD32_8_COMPLETE_WORKER.js
          git commit -m 'Publish complete GPD v32.8 Worker'
          git push
