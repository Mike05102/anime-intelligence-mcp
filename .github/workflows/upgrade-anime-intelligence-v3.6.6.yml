name: Upgrade ANIME INTELLIGENCE to v3.6.6

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Patch worker.js and MCP publish trigger
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("worker.js")
          s = p.read_text(encoding="utf-8")
          original = s

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f"PATCH FAILED: {label} target not found")
              s = s.replace(old, new, 1)
              print("patched:", label)

          replace_once('const VERSION="3.6.5";', 'const VERSION="3.6.6";', "version")

          paid_pattern = re.compile(
              r'async function paidApi\(request,env,url\)\{.*?\n\}\n\nasync function freeSearch',
              re.S
          )
          m = paid_pattern.search(s)
          if not m:
              raise SystemExit("PATCH FAILED: paidApi block not found")

          paid_replacement = r'''function paidCandidateView(p){
            return {
              id:p?.id||null,
              name_ja:cleanNullableTitle(p?.canonical_name_ja),
              name_en:cleanNullableTitle(p?.canonical_name_en),
              manufacturer:cleanNullishValue(p?.manufacturer),
              franchise:discoverySafeFranchise(p),
              jan_code:cleanNullishValue(p?.jan_code),
              model_number:cleanNullishValue(p?.model_number),
              product_type:discoveryEffectiveType(p),
              identity_quality:marketIdentityQuality(p),
              identification_confidence:p?.identification_confidence??identificationConfidenceFor(p)
            };
          }

          function exactPaidIdentityMatch(query,p){
            const raw=String(query||"").trim();
            if(!raw||!p)return false;
            const jan=cleanJan(raw);
            if(jan&&cleanJan(p.jan_code)===jan)return true;
            const qn=normalize(raw);
            const model=normalize(p.model_number||"");
            if(model&&(qn===model||qn.includes(model)))return true;
            const names=[p.canonical_name_ja,p.canonical_name_en].map(x=>normalize(x||"")).filter(Boolean);
            return names.some(n=>n===qn);
          }

          async function preflightPaidProduct(env,url){
            const id=String(url.searchParams.get("id")||"").trim();
            const query=String(url.searchParams.get("query")||"").trim();

            if(id){
              const rows=await sbOptional(env,`/products?select=*&id=eq.${encodeURIComponent(id)}&limit=1`);
              const product=Array.isArray(rows)?rows[0]:null;
              if(!product)return {ok:false,status:404,body:{service:"ANIME INTELLIGENCE",version:VERSION,error:"product_not_found",charged:false,detail:"The supplied canonical product id does not exist. Use /v1/search first."}};
              return {ok:true,product,resolution:"canonical_id"};
            }

            if(!query){
              return {ok:false,status:400,body:{service:"ANIME INTELLIGENCE",version:VERSION,error:"product_identity_required",charged:false,detail:"Supply a canonical product id or an exact JAN/EAN-13, model number, or canonical product name. Use /v1/search for broad requests."}};
            }

            const hints=multilingualQueryHints(query);
            let rows=await findProducts(env,query,10);
            if((!Array.isArray(rows)||!rows.length)&&PIPELINE.selfDiscoveryEnabled){
              try{
                const discovered=await selfDiscoverProduct(env,query);
                if(discovered)rows=[discovered];
              }catch{}
            }
            rows=Array.isArray(rows)?rows:[];

            if(!rows.length){
              return {ok:false,status:404,body:{service:"ANIME INTELLIGENCE",version:VERSION,error:"product_not_found",charged:false,detail:"No canonical product could be resolved before payment. Try an exact JAN/EAN-13, model number or a more specific official product name.",free_search_url:`${url.origin}/v1/search?query=${encodeURIComponent(query)}`}};
            }

            const broad=!!(hints.generic_intent||hints.ambiguous_category_search);
            const exact=rows.filter(p=>exactPaidIdentityMatch(query,p));

            if(broad||exact.length!==1){
              return {
                ok:false,
                status:409,
                body:{
                  service:"ANIME INTELLIGENCE",
                  version:VERSION,
                  error:"disambiguation_required",
                  charged:false,
                  detail:"The query does not resolve to exactly one safe canonical product. No x402 payment was requested. Choose one candidate id, then retry the paid endpoint with ?id=<canonical-product-id>.",
                  free_search_url:`${url.origin}/v1/search?query=${encodeURIComponent(query)}`,
                  candidates:rows.slice(0,5).map(paidCandidateView)
                }
              };
            }

            const product=exact[0];
            url.searchParams.set("id",String(product.id));
            return {ok:true,product,resolution:"exact_query"};
          }

          async function paidApi(request,env,url){
            const rp=routePrice(url.pathname);if(!rp)return null;
            const query=url.searchParams.get("query")||"",lang=detectLanguage(query,url.searchParams.get("lang")||"",request.headers.get("accept-language")||"");
            await logRequestStage(env,request,"api_call",{metadata:{route_type:"paid",intent_query:query?query.slice(0,180):null,intent_id:url.searchParams.get("id")||null}});
            if(query||url.searchParams.get("id"))await logRequestStage(env,request,"product_intent",{metadata:{route_type:"paid",query_text:query?query.slice(0,180):null}});

            let preflight;
            try{preflight=await preflightPaidProduct(env,url);}
            catch(e){
              await logRequestStage(env,request,"identity_preflight_failed",{metadata:{response_status:500,error:safeError(e)}});
              return json({service:"ANIME INTELLIGENCE",version:VERSION,error:"identity_preflight_failed",charged:false,detail:safeError(e)},500);
            }
            if(!preflight.ok){
              await logRequestStage(env,request,preflight.status===409?"disambiguation_required":"product_not_found",{metadata:{response_status:preflight.status,charged:false}});
              return json(preflight.body,preflight.status,{"cache-control":"no-store"});
            }

            const product=preflight.product;
            return x402Gate(request,env,rp[0],rp[1],async()=>{
              await logEvent(env,"product_requested",{endpoint:url.pathname,product_id:product.id,metadata:{product_type:product.product_type||null,jan_present:!!product.jan_code,identity_resolution:preflight.resolution}});
              const livePaths=new Set(["/v1/market","/v1/rarity","/v1/authenticity","/v1/buy-wait","/v1/best-place","/v1/full-intelligence"]);
              const intel=await buildIntelligence(env,product,url.searchParams.get("refresh")==="1",lang,{autoRefresh:livePaths.has(url.pathname)});
              let shaped=shapePaidResponse(url.pathname,intel);
              shaped=sanitizeAffiliateRouting(shaped,url.origin,product.id);
              return {
                service:"ANIME INTELLIGENCE",
                version:VERSION,
                price_usdc_atomic:rp[0],
                price_usdc:Number(rp[0])/1000000,
                identity_resolution:{status:"resolved_before_payment",method:preflight.resolution,canonical_product_id:product.id},
                ...shaped,
                monetization:monetizationFunnel(url.origin,product,url.pathname)
              };
            });
          }

          async function freeSearch'''
          s = s[:m.start()] + paid_replacement + s[m.end():]
          print("patched: pre-payment identity guard")

          old_mcp = '''{paid_x402_url:u.toString(),payment:"Solana USDC via x402 v2",price_usdc:endpointPriceUsd(path),intent:DISCOVERY_CONFIG[path]?.intent||null,expected_output:DISCOVERY_CONFIG[path]?.output_fields||[]}'''
          new_mcp = '''{paid_x402_url:u.toString(),payment:"Solana USDC via x402 v2",price_usdc:endpointPriceUsd(path),intent:DISCOVERY_CONFIG[path]?.intent||null,expected_output:DISCOVERY_CONFIG[path]?.output_fields||[],identity_policy:{exact_identity_required:true,broad_queries_use_free_search_first:true,canonical_id_recommended:true},payment_flow:{protocol:"x402",version:2,network:SOLANA_MAINNET,asset:"USDC",steps:["GET paid_x402_url without payment header","Read HTTP 402 and PAYMENT-REQUIRED header","Create the required Solana USDC payment","Retry the SAME paid_x402_url with payment-signature","On success read HTTP 200 body and PAYMENT-RESPONSE header"]}}'''
          replace_once(old_mcp,new_mcp,"MCP payment handoff")

          ebay_marker = 'async function ebayBrowseRequest(env,params){'
          if ebay_marker not in s:
              raise SystemExit("PATCH FAILED: ebayBrowseRequest not found")
          ebay_helper = r'''function ebayEpnConfigured(env){
            return /^\d{10}$/.test(String(env.EBAY_EPN_CAMPAIGN_ID||"").trim());
          }
          function ebayEndUserContext(env,reference=""){
            if(!ebayEpnConfigured(env))return null;
            const campaign=String(env.EBAY_EPN_CAMPAIGN_ID).trim();
            const ref=String(reference||"").replace(/[^A-Za-z0-9_.-]/g,"").slice(0,120);
            return `affiliateCampaignId=${campaign}${ref?`,affiliateReferenceId=${ref}`:""}`;
          }
          function ebayRequestHeaders(env,token,reference=""){
            const h={authorization:`Bearer ${token}`,"X-EBAY-C-MARKETPLACE-ID":EBAY_MARKETPLACE,accept:"application/json"};
            const ctx=ebayEndUserContext(env,reference);
            if(ctx)h["X-EBAY-C-ENDUSERCTX"]=ctx;
            return h;
          }

          '''
          s=s.replace(ebay_marker,ebay_helper+ebay_marker,1)

          replace_once(
              'const r=await fetch(u.toString(),{headers:{authorization:`Bearer ${token}`,"X-EBAY-C-MARKETPLACE-ID":EBAY_MARKETPLACE,accept:"application/json"}});',
              'const r=await fetch(u.toString(),{headers:ebayRequestHeaders(env,token,"search")});',
              "eBay Browse EPN header"
          )
          replace_once(
              'const token=await ebayAccessToken(env);const r=await fetch(`${EBAY_ITEM_ENDPOINT}/${encodeURIComponent(itemId)}`,{headers:{authorization:`Bearer ${token}`,"X-EBAY-C-MARKETPLACE-ID":EBAY_MARKETPLACE,accept:"application/json"}});',
              'const token=await ebayAccessToken(env);const r=await fetch(`${EBAY_ITEM_ENDPOINT}/${encodeURIComponent(itemId)}`,{headers:ebayRequestHeaders(env,token,String(itemId||"").slice(0,80))});',
              "eBay detail EPN header"
          )

          replace_once(
              'const item=hit.item;if(!item?.itemId||!item?.itemWebUrl||item?.price?.value==null||!item?.price?.currency)continue;',
              'const item=hit.item,purchaseUrl=item?.itemAffiliateWebUrl||item?.itemWebUrl;if(!item?.itemId||!purchaseUrl||item?.price?.value==null||!item?.price?.currency)continue;',
              "eBay affiliate URL selection"
          )
          replace_once('listing_url:item.itemWebUrl,','listing_url:purchaseUrl,',"eBay stored purchase URL")
          replace_once(
              'privacy_mode:"seller_identifier_not_stored"}};',
              'privacy_mode:"seller_identifier_not_stored",affiliate:!!item.itemAffiliateWebUrl,affiliate_source:item.itemAffiliateWebUrl?"ebay_partner_network":null,affiliate_campaign_configured:ebayEpnConfigured(env)}};',
              "eBay affiliate metadata"
          )

          replace_once(
              'const funnelTypes=["api_call","payment_required","payment_attempt","payment_invalid_header","payment_verify_failed","payment_verified","paid_call","payment_settlement_failed","x402_failed","product_intent","product_requested","product_not_found","service_execution_failed"];',
              'const funnelTypes=["api_call","payment_required","payment_attempt","payment_invalid_header","payment_verify_failed","payment_verified","paid_call","payment_settlement_failed","x402_failed","product_intent","product_requested","product_not_found","service_execution_failed","disambiguation_required","identity_preflight_failed","affiliate_click"];',
              "KPI event types"
          )
          replace_once(
              'const calls=events.filter(x=>x.event_type==="api_call"),paid=events.filter(x=>x.event_type==="paid_call"),products=events.filter(x=>x.event_type==="product_requested");',
              'const calls=events.filter(x=>x.event_type==="api_call"),paid=events.filter(x=>x.event_type==="paid_call"),products=events.filter(x=>x.event_type==="product_requested"),affiliateClicks=events.filter(x=>x.event_type==="affiliate_click"),settlementFailures=events.filter(x=>x.event_type==="payment_settlement_failed");',
              "KPI affiliate/settlement counters"
          )
          replace_once(
              'products_requested:products.length,unique_products_requested:new Set(products.map(x=>x.product_id).filter(Boolean)).size,generated_at:new Date().toISOString()}',
              'products_requested:products.length,unique_products_requested:new Set(products.map(x=>x.product_id).filter(Boolean)).size,affiliate_clicks:affiliateClicks.length,affiliate_clicks_by_source:affiliateClicks.reduce((m,x)=>{const k=x.metadata?.source||"unknown";m[k]=(m[k]||0)+1;return m;},{}),settlement_failures:settlementFailures.length,settlement_successes:paid.length,generated_at:new Date().toISOString()}',
              "KPI response"
          )

          replace_once(
              'return {service:"ANIME INTELLIGENCE",version:VERSION,status:kpi.first_revenue_confirmed?"REVENUE_CONFIRMED":"WAITING_FOR_FIRST_PAYMENT",revenue_usdc:kpi.revenue_usdc,paid_calls:kpi.paid_calls,unique_payers:kpi.unique_payers,repeat_payers:kpi.repeat_payers,first_payment:kpi.first_payment,latest_payment:kpi.latest_payment,paid_calls_by_endpoint:kpi.paid_calls_by_endpoint,bazaar,next_action:kpi.first_revenue_confirmed?(bazaar.all_indexed?"optimize_discovery_and_conversion":"wait_for_or_verify_bazaar_indexing"):"wait_for_first_external_x402_settlement",generated_at:new Date().toISOString()};',
              'return {service:"ANIME INTELLIGENCE",version:VERSION,status:kpi.first_revenue_confirmed?"REVENUE_CONFIRMED":"WAITING_FOR_FIRST_PAYMENT",maturity:{registered:true,listed_external:null,searchable_external:null,payment_transport_verified:kpi.payment_verified>0,settlement_verified:kpi.paid_calls>0,first_real_buyer:kpi.unique_payers>0},revenue_usdc:kpi.revenue_usdc,paid_calls:kpi.paid_calls,unique_payers:kpi.unique_payers,repeat_payers:kpi.repeat_payers,affiliate_clicks:kpi.affiliate_clicks||0,settlement_failures:kpi.settlement_failures||0,first_payment:kpi.first_payment,latest_payment:kpi.latest_payment,paid_calls_by_endpoint:kpi.paid_calls_by_endpoint,bazaar,next_action:kpi.first_revenue_confirmed?(bazaar.all_indexed?"optimize_discovery_and_conversion":"wait_for_or_verify_bazaar_indexing"):"wait_for_first_external_x402_settlement",generated_at:new Date().toISOString()};',
              "monetization maturity"
          )

          target='return {info:{input:{type:"http",method:"GET",'
          if target in s:
              s=s.replace(target,'return {discoverable:true,info:{input:{type:"http",method:"GET",discoverable:true,',1)
              print("patched: Bazaar discoverable")
          else:
              print("warning: Bazaar input shape differs; leaving existing Bazaar metadata unchanged")

          s=s.replace(
              'description:"Product name, JAN/EAN-13, model number or other identifying description. Use either query or id."',
              'description:"Exact product name, JAN/EAN-13, model number or canonical id. Broad or ambiguous queries are rejected before payment with HTTP 409 and candidate ids; use /v1/search first."'
          )
          s=s.replace(
              '404:{description:"Product could not be resolved before payment; charged=false."},503:',
              '404:{description:"Product could not be resolved before payment; charged=false."},409:{description:"Ambiguous identity. No payment requested; choose a canonical product id from candidates and retry."},503:'
          )

          replace_once(
              'Queries may be canonical product UUIDs, JAN/EAN-13 codes, model numbers, Japanese names, English names or sufficiently specific product descriptions. Missing products may trigger self-discovery before payment. Product-not-found responses are not charged.',
              'Paid endpoints resolve identity BEFORE x402 payment. Use /v1/search for broad or ambiguous requests, choose one canonical product id, then call the paid endpoint with ?id=<id>. Exact JAN/EAN-13, model-number or canonical-name queries may proceed directly. HTTP 409 disambiguation responses and product-not-found responses are never charged. After HTTP 402, pay the Solana USDC requirement and retry the SAME URL with the payment-signature header.',
              "llms payment guidance"
          )

          s=s.replace(
              'rakuten_affiliate_purchase_routes:rakutenConfigured(env),',
              'rakuten_affiliate_configured:rakutenConfigured(env),rakuten_affiliate_link_mode:"pre_generated_only",rakuten_search_fallback_is_affiliate:false,'
          )
          s=s.replace(
              'world_discovery_one_shot_v365:true,',
              'world_discovery_one_shot_v365:true,end_to_end_monetization_guard_v366:true,'
          )

          required = [
              'const VERSION="3.6.6";',
              'async function preflightPaidProduct',
              'error:"disambiguation_required"',
              'function ebayEpnConfigured',
              'payment_flow:{protocol:"x402"',
              'affiliate_clicks:',
              'end_to_end_monetization_guard_v366:true'
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit("PATCH FAILED integrity: "+repr(missing))

          if s == original:
              raise SystemExit("PATCH FAILED: worker.js unchanged")

          non_ascii=[(i,ch) for i,ch in enumerate(s) if ord(ch)>127]
          if non_ascii:
              raise SystemExit(f"PATCH FAILED: non-ASCII source introduced at {non_ascii[:5]}")

          p.write_text(s,encoding="utf-8")
          print("worker.js upgraded to v3.6.6")

          wf=Path(".github/workflows/main.yml")
          if wf.exists():
              y=wf.read_text(encoding="utf-8")
              if "paths:" not in y:
                  y=y.replace(
                      "    branches:\n      - main\n",
                      "    branches:\n      - main\n    paths:\n      - server.json\n",
                      1
                  )
                  wf.write_text(y,encoding="utf-8")
                  print("main.yml fixed: MCP publish only on server.json changes")

      - name: Syntax check
        run: node --check worker.js

      - name: Verify patch
        shell: bash
        run: |
          grep -F 'const VERSION="3.6.6";' worker.js
          grep -F 'end_to_end_monetization_guard_v366:true' worker.js
          grep -F 'disambiguation_required' worker.js
          grep -F 'ebayEpnConfigured' worker.js

      - name: Commit v3.6.6
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js .github/workflows/main.yml
          git commit -m "Upgrade ANIME INTELLIGENCE to v3.6.6 end-to-end monetization" || exit 0
          git push
