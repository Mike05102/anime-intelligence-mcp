name: Verify GPD 33 release
on:
  push:
    branches: [main]
    paths:
      - releases/GPD33_0_COMPLETE_WORKER.js
      - supabase/migrations/*gpd33*.sql
      - supabase/maintenance/gpd33_*.sql
      - supabase/maintenance/run_gpd33_storage.sh
      - supabase/maintenance/github_*
      - .github/workflows/gpd33-production-maintenance.yml
      - supabase/gpd33_production_preflight.sql
      - scripts/gpd33_reconcile*.mjs
      - scripts/gpd33_seller_discovery.mjs
      - scripts/gpd33_merchant_offer_feed.mjs
      - scripts/gpd33_merchant_feed_fetch.mjs
      - scripts/gpd33_partner_review.mjs
      - tests/gpd33_*
      - .github/workflows/verify-gpd33-complete.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check releases/GPD33_0_COMPLETE_WORKER.js
      - run: node tests/gpd33_worker.mjs
      - run: node tests/gpd33_reconcile.mjs
      - run: node tests/gpd33_reconcile_signed.mjs
      - run: node tests/gpd33_seller_discovery.mjs
      - run: node tests/gpd33_merchant_offer_feed.mjs
      - run: node tests/gpd33_merchant_feed_fetch.mjs
      - run: node tests/gpd33_partner_review.mjs
      - run: npm install --prefix "${RUNNER_TEMP}/gpd33" pg@8.16.3
      - run: GPD33_PG_MODULE="${RUNNER_TEMP}/gpd33/node_modules/pg/lib/index.js" node tests/gpd33_database.mjs
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: local-ci-password
          PGDATABASE: postgres
      - name: Exercise the production archive and isolated restore path on fixtures
        run: |
          bash -n supabase/maintenance/github_storage.sh
          bash -n supabase/maintenance/github_db_run.sh
          bash -n supabase/maintenance/github_restore_check.sh
          private="$RUNNER_TEMP/gpd33-private"
          install -d -m 0700 "$private"
          (
            umask 077
            printf '%s\n' PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres \
              PGDATABASE=postgres PGPASSWORD=local-ci-password > "$private/db.env"
          )
          if bash supabase/maintenance/github_db_run.sh egress-check 1; then
            echo 'An insufficient egress budget was accepted.' >&2
            exit 1
          fi
          bash supabase/maintenance/github_db_run.sh egress-check 1000000000
          bash supabase/maintenance/github_db_run.sh backup
          bash supabase/maintenance/github_restore_check.sh
          bash supabase/maintenance/github_db_run.sh apply 1000000000
