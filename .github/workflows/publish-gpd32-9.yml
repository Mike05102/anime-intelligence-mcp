name: Publish GPD v32.9 bounded discovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-gpd32-9.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify
        run: |
          python3 scripts/build_gpd32_9.py
          node --check releases/GPD32_9_COMPLETE_WORKER.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('releases/GPD32_9_COMPLETE_WORKER.js').read_text()
          for x in ['const VERSION="32.9.0"','Math.max(1,Math.min(1,Number(limit)||1))','if(enrichmentDiagnostics.attempted>=5)break;','batchCandidates.slice(i,i+8)','batch_insert_fallback','if(matches.length>1)','if(janMatches.length>1)','growth_24h:growth24h','source:"expansion_events_not_database_count"']:
              assert x in s,x
          print('PASS static regression checks')
          PY
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/GPD32_9_COMPLETE_WORKER.js
          git commit -m 'Publish complete GPD v32.9 Worker'
          git push

