name: Publish GPD v32.2 full Worker
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-gpd32-2.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate and syntax-check complete Worker
        run: |
          python3 scripts/build_gpd32_2.py
          node --check releases/GPD32_2_COMPLETE_WORKER.js
      - name: Publish complete Worker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/GPD32_2_COMPLETE_WORKER.js
          git commit -m 'Publish complete GPD v32.2 Worker'
          git push
