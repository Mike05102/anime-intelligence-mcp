name: GPD 33 candidate verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-gpd33-0.yml','scripts/build_gpd33_0.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/build_gpd33_0.py
          node --check releases/GPD33_0_CANDIDATE_WORKER.js
          node /tmp/gpd33-test.cjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/GPD33_0_CANDIDATE_WORKER.js
          git commit -m 'Save tested GPD 33 candidate' 
          git push
