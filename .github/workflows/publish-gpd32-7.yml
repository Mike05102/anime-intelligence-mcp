name: Publish GPD v32.7 identity throughput
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-gpd32-7.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify Worker
        run: |
          python3 scripts/build_gpd32_7.py
          node --check releases/GPD32_7_COMPLETE_WORKER.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('releases/GPD32_7_COMPLETE_WORKER.js').read_text()
          assert 'const VERSION="32.7.0"' in s
          assert 'identity_detail_budget:10' in s
          assert 'if(enrichmentDiagnostics.attempted>=10)break;' in s
          assert 'Math.floor(Date.now()/600000)*10)%identityTargets.length' in s
          assert 'batchCandidates.slice(i,i+8)' in s
          assert 'batch_insert_fallback' in s
          assert 'if(matches.length>1)' in s
          assert 'if(janMatches.length>1)' in s
          print('PASS syntax, identity gates, rotation, and batch fallback')
          PY
      - name: Publish complete Worker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/GPD32_7_COMPLETE_WORKER.js
          git commit -m 'Publish complete GPD v32.7 Worker'
          git push
